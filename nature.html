<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature cinematic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Loading Animation -->
    <div class="loader-wrapper">
        <div class="loader">
            <div class="camera-icon">
                
                <i class="fas fa-camera"></i>
                
            </div>
            
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <span class="logo-text">Nature</span>
            <span class="logo-dot"> .Beauty</span>
        </div>
        <div class="theme-toggle" id="themeToggle">
            <div class="toggle-track">
                <div class="toggle-thumb"></div>
                <i class="fas fa-sun"></i>
                <i class="fas fa-moon"></i>
            </div>
        </div>
    </header>

    <!-- Main Navigation -->
    <nav class="main-nav">
        <button class="nav-btn active" data-section="home">
            <i class="fas fa-th-large"></i>
            <span>Gallery</span>
        </button>
        <button class="nav-btn" data-section="albums">
            <i class="fas fa-book"></i>
            <span>Albums</span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Home Gallery -->
        <section class="gallery-section active-section" id="homeGallery">
            <div class="gallery-grid">
                <!-- Initial 10 images -->
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="/home img/sunset in village.jpg" alt="sunset in village" loading="lazy">
                </div>
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="/home img/flower.jpg" alt="flower" loading="lazy">
                </div>
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="/home img/insects on tree.jpg" alt="Close-up" loading="lazy">
                </div>
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="home img/sunset at station.jpg" alt="Moody urban sunset at station" loading="lazy">
                </div>
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="/home img/thumsup.jpg" alt="Thumbs up" loading="lazy">
                </div>
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="/home img/golden tree.jpg" alt="new born wheet tree" loading="lazy">
                </div>
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="home img/sunrise with drop.jpg" alt="sunrise with a drop of rain" loading="lazy">
                </div>
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="/home img/kids.jpg" alt="Kids playing" loading="lazy">
                </div>
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="/home img/gaon ki galiyan.jpg" alt="clouds on village street" loading="lazy">
                </div>
                <div class="gallery-item">
                    <div class="media-loader"></div>
                    <img src="/home img/eye.jpg" alt="human eye macro shots" loading="lazy">
                </div>
                
                <!-- 50 placeholder images -->
                <div class="gallery-item hidden">
                    <div class="media-loader"></div>
                    <img src="/home img/monkey on scooty.jpg" alt="Placeholder image 11" loading="lazy">
                </div>
                <!-- Add remaining 49 placeholders similarly -->
                
                <!-- Sample videos -->
                <div class="gallery-item video-item hidden">
                    <div class="media-loader"></div>
                    <video poster="/home img/coffe.jpg" class="video-thumbnail">
                        <source src="videos.mp4" type="video/mp4">
                    </video>
                    <div class="play-button"><i class="fas fa-play"></i></div>
                </div>
                <!-- Add more videos as needed -->
            </div>
        </section>

        <!-- Albums Gallery -->
        <section class="albums-section" id="albumsGallery">
            <div class="albums-grid">
                <a href="index.html" class="album-card">
                    <div class="media-loader"></div>
                    <img src="/home img/golden tree.jpg" alt="Nature album cover" loading="lazy">
                    <div class="album-info">
                        <h3 class="album-title">Nature</h3>
                        <span class="album-count">24 photos</span>
                    </div>
                </a>
                <!-- Add more albums similarly -->
            </div>
        </section>
    </main>

    <!-- Image Viewer -->
    <div class="image-viewer" id="imageViewer">
        <button class="close-btn" id="closeBtn">
            <i class="fas fa-times"></i>
        </button>
        <div class="viewer-content">
            <div class="media-loader"></div>
            <img id="viewedImage" src="" alt="">
            <div class="image-meta">
                <div class="image-title" id="imageTitle"></div>
                <div class="image-desc" id="imageDesc"></div>
            </div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="video-modal" id="videoModal">
        <div class="video-modal-content">
            <button class="close-btn" id="videoCloseBtn">
                <i class="fas fa-times"></i>
            </button>
            <div class="media-loader"></div>
            <video controls id="modalVideo">
                Your browser does not support the video tag.
            </video>
            <div class="video-meta">
                <div class="video-title" id="videoTitle"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
